title: Windows Failed Logon Event
id: 47a3bfa7-7e53-4b95-8d10-5c0f3d89a002
status: experimental
description: Detects individual Windows failed logons (Event 4625). A brute-force hypothesis requires additional time-window and source/account correlation.
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
falsepositives:
  - Mistyped passwords
  - Stale service or scheduled-task credentials
level: low
tags:
  - attack.credential_access
  - attack.t1110
