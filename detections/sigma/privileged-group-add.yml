title: Member Added to a Security-Enabled Global Group
id: 47a3bfa7-7e53-4b95-8d10-5c0f3d89a003
status: experimental
description: Detects Windows Security 4728 for membership additions to security-enabled global groups. This broad rule is not restricted to Domain Admins; filter target group SID or name during triage.
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4728
  condition: selection
falsepositives:
  - Authorized group membership administration
level: medium
tags:
  - attack.persistence
  - attack.t1098
